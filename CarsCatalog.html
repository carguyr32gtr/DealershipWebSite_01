<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="./style.css" rel="stylesheet" />
</head>
<body>
    <header class="header py-3">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-auto">
                    <img src="" alt="img" class="header-top-logo">
                </div>
                <div class="col">
                    <nav class="nav d-flex gap-3">
                        <a href="/index.html" class="nav-link">
                            <img src="pics/homepage.png" alt="">Головна
                        </a>
                        <a href="/CarsCatalog.html" class="nav-link">
                            <img src="pics/catalog.png" alt="">Каталог
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <section class="py-5">
        <div class="container text-center">
            <h2 class="mb-4">Наш Каталог</h2>
            <div class="swiper swiper-container">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="pics/car1.jpg" alt="car 1" class="img-fluid slider-img">
                    </div>
                    <div class="swiper-slide">
                        <img src="pics/car2.jpg" alt="car 2" class="img-fluid slider-img">
                    </div>
                    <div class="swiper-slide">
                        <img src="pics/car3.jpg" alt="car 3" class="img-fluid slider-img">
                    </div>
                    <div class="swiper-slide">
                        <img src="pics/car4.jpg" alt="car 4" class="img-fluid slider-img">
                    </div>
                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            new Swiper('.swiper-container', {
                loop: true,
                slidesPerView: 1,
                spaceBetween: 0,
                pagination: { el: '.swiper-pagination', clickable: true },
                navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
            });
        });
    </script>
</body>
</html>
